<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight Player</title>

  <!-- Библиотеки -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body, html {
      margin: 0; padding: 0;
      background: #000; color: #fff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      /* Скрываем стандартный курсор */
      cursor: none;
    }

    /* ================= КУРСОР ================= */
    .cursor-el {
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9999;
      border-radius: 50%; transform: translate(-50%, -50%);
      will-change: transform;
    }
    #cursor-dot {
      width: 6px; height: 6px;
      background: #fff;
      box-shadow: 0 0 10px #0071e3, 0 0 20px #0071e3;
    }
    #cursor-ring {
      width: 36px; height: 36px;
      border: 1.5px solid rgba(255,255,255,0.5);
      transition: width 0.2s, height 0.2s, background-color 0.2s, border-color 0.2s;
    }
    #cursor-ring.hovering {
      width: 60px; height: 60px;
      background: rgba(0, 113, 227, 0.2);
      border-color: #0071e3;
    }
    @media (hover: none) {
      .cursor-el { display: none; }
      body, html { cursor: auto; }
    }

    /* ================= ФОН ================= */
    .bg-image {
      position: fixed; inset: 0; z-index: -2;
      /* Твоя картинка с деревом */
      background: url('tree.jpg') center/cover no-repeat;
      filter: brightness(0.6) contrast(1.1);
    }
    .bg-overlay {
      position: fixed; inset: 0; z-index: -1;
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.9) 100%);
      pointer-events: none;
    }

    /* ================= СТЕКЛО ================= */
    .glass {
      background: rgba(15, 15, 20, 0.7);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    audio { display: none; }

    /* ================= ВИЗУАЛИЗАТОР ================= */
    #visualizer {
      width: 100%; height: 60px;
      border-radius: 12px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.05);
    }

    /* ================= СПИСОК ================= */
    .playlist-scroll::-webkit-scrollbar { width: 4px; }
    .playlist-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    
    .track-item { transition: 0.2s; }
    .track-item:hover { background: rgba(255,255,255,0.1); }
    .track-item.active { background: rgba(0,113,227,0.2); border: 1px solid rgba(0,113,227,0.5); }
    
    .delete-btn { opacity: 0; transition: 0.2s; }
    .track-item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { color: #ff453a; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #0071e3; border-radius: 50%;
      animation: spin 0.8s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

  <!-- Курсор -->
  <div id="cursor-dot" class="cursor-el"></div>
  <div id="cursor-ring" class="cursor-el"></div>

  <!-- Фон -->
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <!-- Заголовок -->
  <header class="text-center mt-6 mb-8 z-10">
    <h1 class="text-4xl md:text-6xl font-bold tracking-tight">Midnight<span class="text-blue-500">Player</span></h1>
    <p class="text-white/40 text-xs tracking-[0.3em] uppercase mt-2">Global Search · Local Files</p>
  </header>

  <!-- Интерфейс -->
  <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-6 z-10">

    <!-- Плеер -->
    <div class="glass rounded-3xl p-6 flex flex-col items-center justify-between h-[540px]">
      
      <!-- Пластинка -->
      <div class="w-40 h-40 rounded-full border border-white/10 flex items-center justify-center relative overflow-hidden mb-4 shadow-[0_0_40px_rgba(0,113,227,0.3)]">
        <div id="vinyl" class="w-full h-full rounded-full bg-gradient-to-br from-[#1a1a1a] to-[#000] flex items-center justify-center border-[8px] border-[#111]">
          <div class="w-10 h-10 rounded-full bg-blue-500/20 border border-blue-500/50"></div>
        </div>
      </div>

      <!-- Визуализатор -->
      <canvas id="visualizer" class="mb-4"></canvas>

      <!-- Инфо -->
      <div class="text-center w-full mb-4">
        <h2 id="track-title" class="text-sm font-semibold truncate text-white/90">Нет трека</h2>
        <p id="track-artist" class="text-[10px] text-white/40 mt-1">Загрузите файл или найдите онлайн</p>
      </div>

      <!-- Прогресс -->
      <div class="w-full mb-4">
        <input type="range" id="progress" value="0" max="100" class="w-full h-1 bg-white/10 rounded appearance-none accent-blue-500 cursor-pointer">
        <div class="flex justify-between text-[10px] text-white/40 mt-1">
          <span id="curr-time">0:00</span>
          <span id="total-time">0:00</span>
        </div>
      </div>

      <!-- Кнопки -->
      <div class="flex items-center gap-6">
        <button id="prev-btn" class="text-white/50 hover:text-white transition-colors">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="play-btn" class="w-14 h-14 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-[0_0_20px_rgba(255,255,255,0.4)]">
          <svg id="play-icon" class="w-6 h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pause-icon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="next-btn" class="text-white/50 hover:text-white transition-colors">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>

    <!-- Плейлист -->
    <div class="glass rounded-3xl p-5 col-span-1 md:col-span-2 h-[540px] flex flex-col relative overflow-hidden">
      
      <!-- Поиск -->
      <div class="mb-4">
        <div class="flex gap-2">
          <input id="search-input" type="text" placeholder="Поиск в интернете (iTunes)..."
                 class="flex-1 bg-white/10 border border-white/10 rounded-full px-4 py-2 text-xs outline-none focus:border-blue-500 transition-colors" />
          <button id="search-btn" class="bg-blue-600 hover:bg-blue-500 active:scale-95 px-4 py-2 rounded-full text-xs font-medium transition-all">Найти</button>
        </div>
        <div id="search-results" class="hidden mt-2 max-h-[120px] overflow-y-auto playlist-scroll space-y-1 bg-black/40 rounded-xl p-1"></div>
      </div>

      <!-- Заголовок списка -->
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-white/50">Треки <span id="track-count" class="text-white/30">(0)</span></h3>
        <label for="file-upload" class="cursor-pointer bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full text-[10px] font-medium transition-colors flex items-center gap-1">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Файл
        </label>
        <input id="file-upload" type="file" accept="audio/*" multiple class="hidden">
      </div>

      <!-- Список -->
      <div id="playlist" class="flex-1 overflow-y-auto playlist-scroll pr-1 space-y-1">
        <div class="text-center text-white/30 text-xs mt-10" id="empty-msg">Пока пусто...</div>
      </div>
    </div>
  </main>

  <audio id="audio-player"></audio>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      'use strict';

      // ==========================================
      // 1. КУРСОР
      // ==========================================
      const dot = document.getElementById('cursor-dot');
      const ring = document.getElementById('cursor-ring');
      
      if (window.matchMedia('(hover: hover) and (pointer: fine)').matches && window.gsap) {
        const xDot = gsap.quickTo(dot, 'x', { duration: 0.1 });
        const yDot = gsap.quickTo(dot, 'y', { duration: 0.1 });
        const xRing = gsap.quickTo(ring, 'x', { duration: 0.4 });
        const yRing = gsap.quickTo(ring, 'y', { duration: 0.4 });

        window.addEventListener('mousemove', e => {
          xDot(e.clientX); yDot(e.clientY);
          xRing(e.clientX); yRing(e.clientY);
        });

        // Наведение
        document.body.addEventListener('mouseover', e => {
          if (e.target.closest('button, input, label, .track-item')) {
            ring.classList.add('hovering');
          } else {
            ring.classList.remove('hovering');
          }
        });
      }

      // ==========================================
      // 2. ПЕРЕМЕННЫЕ
      // ==========================================
      const audio = document.getElementById('audio-player');
      const playBtn = document.getElementById('play-btn');
      const playIcon = document.getElementById('play-icon');
      const pauseIcon = document.getElementById('pause-icon');
      const titleEl = document.getElementById('track-title');
      const artistEl = document.getElementById('track-artist');
      const progress = document.getElementById('progress');
      const currTime = document.getElementById('curr-time');
      const totalTime = document.getElementById('total-time');
      const playlistEl = document.getElementById('playlist');
      const emptyMsg = document.getElementById('empty-msg');
      const fileUpload = document.getElementById('file-upload');
      const vinyl = document.getElementById('vinyl');
      const trackCount = document.getElementById('track-count');

      let tracks = [];
      let currentIndex = -1;
      let isPlaying = false;
      let vinylAnim = null;

      // ==========================================
      // 3. ВИЗУАЛИЗАТОР (Web Audio API)
      // ==========================================
      const canvas = document.getElementById('visualizer');
      const ctx = canvas.getContext('2d');
      let audioCtx, analyser, source, dataArray;
      let vizId = null;

      function initAudio() {
        if (audioCtx) return;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 128;
          analyser.smoothingTimeConstant = 0.8;
          dataArray = new Uint8Array(analyser.frequencyBinCount);
          
          source = audioCtx.createMediaElementSource(audio);
          source.connect(analyser);
          analyser.connect(audioCtx.destination);
        } catch(e) { console.warn('Аудио-контекст не поддерживается'); }
      }

      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resizeCanvas);

      function drawViz() {
        if (!analyser) return;
        vizId = requestAnimationFrame(drawViz);
        analyser.getByteFrequencyData(dataArray);

        const rect = canvas.getBoundingClientRect();
        const w = rect.width, h = rect.height;
        ctx.clearRect(0, 0, w, h);

        const bars = 32;
        const barW = w / bars;
        
        for (let i = 0; i < bars; i++) {
          const val = dataArray[i] / 255;
          const barH = Math.max(2, val * h);
          const x = i * barW + 1;
          const y = h - barH;
          
          const grad = ctx.createLinearGradient(0, h, 0, y);
          grad.addColorStop(0, `rgba(0, 113, 227, ${0.6 + val * 0.4})`);
          grad.addColorStop(1, `rgba(66, 165, 245, ${0.8 + val * 0.2})`);
          
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.roundRect(x, y, barW - 2, barH, [2, 2, 0, 0]);
          ctx.fill();
        }
      }

      // ==========================================
      // 4. ЛОГИКА ПЛЕЕРА
      // ==========================================
      function formatTime(s) {
        if (isNaN(s)) return '0:00';
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return m + ':' + (sec < 10 ? '0' : '') + sec;
      }

      function loadTrack(index) {
        if (index < 0 || index >= tracks.length) return;
        currentIndex = index;
        const track = tracks[index];
        audio.src = track.url;
        titleEl.textContent = track.name;
        artistEl.textContent = track.artist;
        progress.value = 0;
        renderPlaylist();
      }

      function playAudio() {
        if (currentIndex === -1) return;
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        
        audio.play().catch(e => console.log(e));
        isPlaying = true;
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        
        if (window.gsap) {
          if (vinylAnim) vinylAnim.kill();
          vinylAnim = gsap.to(vinyl, { rotation: 360, duration: 4, repeat: -1, ease: 'none' });
        }
        if (vizId) cancelAnimationFrame(vizId);
        drawViz();
        renderPlaylist();
      }

      function pauseAudio() {
        audio.pause();
        isPlaying = false;
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        if (window.gsap && vinylAnim) vinylAnim.kill();
        if (vizId) { cancelAnimationFrame(vizId); vizId = null; }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        renderPlaylist();
      }

      playBtn.addEventListener('click', () => {
        if (currentIndex === -1 && tracks.length > 0) {
          loadTrack(0);
          playAudio();
        } else if (isPlaying) {
          pauseAudio();
        } else {
          playAudio();
        }
      });

      document.getElementById('next-btn').addEventListener('click', () => {
        if (tracks.length > 0) {
          loadTrack((currentIndex + 1) % tracks.length);
          playAudio();
        }
      });

      document.getElementById('prev-btn').addEventListener('click', () => {
        if (tracks.length > 0) {
          loadTrack((currentIndex - 1 + tracks.length) % tracks.length);
          playAudio();
        }
      });

      audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
          progress.value = (audio.currentTime / audio.duration) * 100;
          currTime.textContent = formatTime(audio.currentTime);
          totalTime.textContent = formatTime(audio.duration);
        }
      });

      progress.addEventListener('input', () => {
        if (audio.duration) audio.currentTime = (progress.value / 100) * audio.duration;
      });

      audio.addEventListener('ended', () => {
        if (tracks.length > 0) {
          loadTrack((currentIndex + 1) % tracks.length);
          playAudio();
        }
      });

      // ==========================================
      // 5. РЕНДЕР И УДАЛЕНИЕ
      // ==========================================
      function renderPlaylist() {
        Array.from(playlistEl.children).forEach(c => {
          if (c.id !== 'empty-msg') c.remove();
        });
        
        trackCount.textContent = `(${tracks.length})`;
        
        if (tracks.length === 0) {
          emptyMsg.style.display = 'block';
          return;
        }
        emptyMsg.style.display = 'none';

        tracks.forEach((track, i) => {
          const isActive = (i === currentIndex);
          const div = document.createElement('div');
          div.className = `track-item flex items-center justify-between p-2 rounded-xl cursor-pointer ${isActive ? 'active' : ''}`;
          div.innerHTML = `
            <div class="flex items-center gap-2 min-w-0 flex-1">
              <div class="w-6 h-6 rounded-full bg-white/10 flex items-center justify-center text-[9px] shrink-0">${isActive && isPlaying ? '❚❚' : '▶'}</div>
              <div class="min-w-0 flex-1">
                <p class="text-xs font-medium text-white/90 truncate">${track.name}</p>
                <p class="text-[9px] text-white/40 truncate">${track.artist}</p>
              </div>
            </div>
            <button class="delete-btn p-1.5 hover:bg-red-500/20 rounded-full text-white/50 transition-colors" data-idx="${i}">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          `;
          
          div.addEventListener('click', (e) => {
            if (e.target.closest('.delete-btn')) return;
            if (currentIndex === i) {
              isPlaying ? pauseAudio() : playAudio();
            } else {
              loadTrack(i);
              playAudio();
            }
          });

          div.querySelector('.delete-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentIndex === i) {
              pauseAudio();
              audio.src = '';
              currentIndex = -1;
              titleEl.textContent = 'Нет трека';
              artistEl.textContent = 'Загрузите файл или найдите онлайн';
            } else if (i < currentIndex) {
              currentIndex--;
            }
            tracks.splice(i, 1);
            renderPlaylist();
          });

          playlistEl.appendChild(div);
        });
      }

      // ==========================================
      // 6. ЗАГРУЗКА ЛОКАЛЬНЫХ ФАЙЛОВ
      // ==========================================
      fileUpload.addEventListener('change', (e) => {
        Array.from(e.target.files).forEach(file => {
          if (file.type.startsWith('audio/')) {
            tracks.push({
              name: file.name.replace(/\.[^/.]+$/, ''),
              artist: 'Локальный файл',
              url: URL.createObjectURL(file)
            });
          }
        });
        renderPlaylist();
      });

      // ==========================================
      // 7. ПОИСК В ИНТЕРНЕТЕ (iTunes API)
      // ==========================================
      const searchInput = document.getElementById('search-input');
      const searchBtn = document.getElementById('search-btn');
      const searchResults = document.getElementById('search-results');

      searchBtn.addEventListener('click', async () => {
        const q = searchInput.value.trim();
        if (!q) return;

        searchResults.classList.remove('hidden');
        searchResults.innerHTML = '<div class="flex items-center gap-2 p-2 text-xs text-white/50"><span class="spinner"></span> Поиск...</div>';

        try {
          // iTunes Search API (работает без ключей, ищет всё)
          const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&limit=6`);
          const data = await res.json();
          
          if (data.resultCount === 0) {
            searchResults.innerHTML = '<p class="text-white/40 text-xs p-2">Ничего не найдено</p>';
            return;
          }

          searchResults.innerHTML = data.results.map(t => {
            return `
              <div class="flex items-center justify-between p-2 rounded hover:bg-white/10 cursor-pointer text-[11px] search-item"
                   data-url="${t.previewUrl}" data-title="${t.trackName.replace(/"/g, '&quot;')}" data-artist="${t.artistName.replace(/"/g, '&quot;')}">
                <div class="truncate flex-1">
                  <span class="text-white/90">${t.trackName}</span>
                  <span class="text-white/40 ml-1">${t.artistName}</span>
                </div>
                <span class="text-blue-400 text-[10px] ml-2">+</span>
              </div>
            `;
          }).join('');

          document.querySelectorAll('.search-item').forEach(el => {
            el.addEventListener('click', () => {
              tracks.push({
                name: el.dataset.title,
                artist: el.dataset.artist,
                url: el.dataset.url
              });
              renderPlaylist();
              loadTrack(tracks.length - 1);
              playAudio();
              searchResults.classList.add('hidden');
            });
          });

        } catch(e) {
          searchResults.innerHTML = '<p class="text-red-400 text-xs p-2">Ошибка сети. Проверь интернет.</p>';
        }
      });

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') searchBtn.click();
      });

      // Инициализация
      resizeCanvas();
      renderPlaylist();
    });
  </script>
</body>
</html>
