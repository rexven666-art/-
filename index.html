<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight Player — Visualizer Edition</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    body, html {
      margin: 0; padding: 0;
      background: #000; color: #fff;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* Курсор */
    @media (hover: hover) and (pointer: fine) {
      body, html, button, label, input, a { cursor: none; }
      #cursor-dot, #cursor-ring, #cursor-glow {
        position: fixed; top: 0; left: 0;
        pointer-events: none; z-index: 9999;
        border-radius: 50%; transform: translate(-50%, -50%);
        will-change: transform;
      }
      #cursor-dot { width: 8px; height: 8px; background: #fff; box-shadow: 0 0 12px #0071e3, 0 0 24px #0071e3; }
      #cursor-ring {
        width: 40px; height: 40px;
        border: 1.5px solid rgba(255,255,255,0.5);
        transition: width .25s ease, height .25s ease, border-color .25s, background-color .25s;
      }
      #cursor-ring.hovering { width: 70px; height: 70px; border-color: #0071e3; background: rgba(0,113,227,0.15); }
      #cursor-glow {
        width: 120px; height: 120px;
        background: radial-gradient(circle, rgba(0,113,227,0.25) 0%, transparent 70%);
        filter: blur(20px); opacity: 0.6;
      }
    }
    @media (hover: none) {
      #cursor-dot, #cursor-ring, #cursor-glow { display: none; }
    }

    /* Фон */
    .bg-canvas { position: fixed; inset: 0; z-index: -3; background: #000; overflow: hidden; }
    .bg-grid-lines {
      position: absolute; inset: -50%;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      transform: perspective(500px) rotateX(10deg);
      animation: gridMove 20s linear infinite;
    }
    @keyframes gridMove {
      0% { transform: perspective(500px) rotateX(10deg) translateY(0); }
      100% { transform: perspective(500px) rotateX(10deg) translateY(60px); }
    }
    .bg-orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.5; animation: orbFloat 12s ease-in-out infinite alternate; }
    .orb-a { width: 500px; height: 500px; background: #0051a8; top: -10%; left: -10%; }
    .orb-b { width: 400px; height: 400px; background: #1a3a6e; bottom: -10%; right: -10%; animation-delay: -6s; }
    .orb-c { width: 300px; height: 300px; background: #42a5f5; top: 40%; left: 50%; opacity: 0.2; animation-delay: -3s; }
    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.15); }
    }

    .glass {
      background: rgba(15, 15, 20, 0.65);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 40px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.02);
    }

    audio { display: none; }
    .playlist-scroll::-webkit-scrollbar { width: 4px; }
    .playlist-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

    /* ВАЖНО: Элементы видны по умолчанию! */
    .reveal { opacity: 1; transform: none; }

    .delete-btn { opacity: 0; transition: opacity .2s, color .2s; color: rgba(255,255,255,0.3); }
    .track-item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { color: #ff453a; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #0071e3;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #visualizer {
      width: 100%; height: 50px;
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .track-item.inactive { opacity: 0.45; }
    .track-item.inactive .track-name { text-decoration: line-through; }
    .reactivate-btn {
      font-size: 9px; padding: 2px 6px; border-radius: 999px;
      background: rgba(0,113,227,0.2); color: #42a5f5;
      border: 1px solid rgba(0,113,227,0.4);
      transition: background .2s;
    }
    .reactivate-btn:hover { background: rgba(0,113,227,0.4); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

  <div id="cursor-glow"></div>
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <div class="bg-canvas">
    <div class="bg-grid-lines"></div>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div class="bg-orb orb-c"></div>
  </div>

  <header class="reveal text-center mt-6 mb-4 z-10">
    <h1 class="text-4xl md:text-6xl font-bold tracking-tight">Midnight<span class="text-blue-500">Player</span></h1>
    <p class="text-white/40 text-xs tracking-[0.3em] uppercase mt-2">Visualizer · Persistent · Online</p>
  </header>

  <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-5 z-10 reveal">

    <div class="glass rounded-3xl p-6 flex flex-col items-center justify-between h-[520px]">
      <div class="w-40 h-40 rounded-full border border-white/10 flex items-center justify-center relative overflow-hidden mb-3 shadow-[0_0_60px_rgba(0,113,227,0.25)]">
        <div id="vinyl" class="w-full h-full rounded-full bg-gradient-to-br from-[#1a1a1a] to-[#000] flex items-center justify-center border-[8px] border-[#111]">
          <div class="w-10 h-10 rounded-full bg-blue-500/20 border border-blue-500/50"></div>
        </div>
        <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/5 to-white/20 pointer-events-none"></div>
      </div>

      <canvas id="visualizer" class="mb-3"></canvas>

      <div class="text-center w-full mb-2">
        <h2 id="track-title" class="text-sm font-semibold truncate px-2">Нет трека</h2>
        <p id="track-artist" class="text-[10px] text-white/40 mt-0.5">Загрузите файл или найдите онлайн</p>
      </div>

      <div class="w-full mb-2">
        <input type="range" id="progress" value="0" max="100" class="w-full h-1 bg-white/10 rounded-lg appearance-none accent-blue-500">
        <div class="flex justify-between text-[10px] text-white/40 mt-1">
          <span id="curr-time">0:00</span>
          <span id="total-time">0:00</span>
        </div>
      </div>

      <div class="flex items-center gap-6">
        <button id="prev-btn" class="text-white/50 hover:text-white transition-colors">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="play-btn" class="w-14 h-14 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-[0_0_25px_rgba(255,255,255,0.35)]">
          <svg id="play-icon" class="w-6 h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pause-icon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="next-btn" class="text-white/50 hover:text-white transition-colors">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>

    <div class="glass rounded-3xl p-5 col-span-1 md:col-span-2 h-[520px] flex flex-col relative overflow-hidden">

      <div class="mb-3">
        <div class="flex gap-2">
          <input id="search-input" type="text" placeholder="Поиск в интернете (Audius)..."
                 class="flex-1 bg-white/10 border border-white/15 rounded-full px-4 py-2 text-xs outline-none focus:border-blue-500 transition-colors" />
          <button id="search-btn" class="bg-blue-600 hover:bg-blue-500 active:scale-95 px-4 py-2 rounded-full text-xs font-medium transition-all">Найти</button>
        </div>
        <div id="search-results" class="hidden mt-2 max-h-[100px] overflow-y-auto playlist-scroll space-y-1"></div>
      </div>

      <div class="flex justify-between items-center mb-3">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-white/50">Плейлист <span id="track-count" class="text-white/30 normal-case tracking-normal">(0)</span></h3>
        <div class="flex gap-2">
          <button id="clear-btn" class="bg-white/5 hover:bg-red-500/20 border border-white/10 px-3 py-1.5 rounded-full text-[10px] font-medium transition-colors text-white/60 hover:text-red-400">
            Очистить
          </button>
          <label for="file-upload" class="cursor-pointer bg-white/10 hover:bg-white/20 border border-white/10 px-3 py-1.5 rounded-full text-[10px] font-medium transition-colors flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Добавить
          </label>
          <input id="file-upload" type="file" accept="audio/*" multiple class="hidden">
        </div>
      </div>

      <div id="playlist" class="flex-1 overflow-y-auto playlist-scroll pr-1 space-y-1">
        <div class="text-center text-white/25 text-xs mt-10" id="empty-msg">
          Пока пусто. Загрузи файлы или найди онлайн.
        </div>
      </div>

      <div id="drop-zone" class="absolute inset-0 bg-blue-500/20 backdrop-blur-sm border-2 border-blue-500 border-dashed rounded-3xl hidden items-center justify-center flex-col z-20 pointer-events-none">
        <svg class="w-10 h-10 text-blue-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
        <p class="text-blue-400 font-semibold text-sm">Отпусти, чтобы загрузить</p>
      </div>
    </div>
  </main>

  <audio id="audio-player" crossorigin="anonymous"></audio>
