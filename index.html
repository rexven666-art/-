<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight Player — Full Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; min-height: 100vh; }

    /* КУРСОР */
    .cursor-dot, .cursor-ring, .cursor-glow {
      position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
      border-radius: 50%; transform: translate(-50%, -50%); will-change: transform;
    }
    .cursor-dot { width: 6px; height: 6px; background: #fff; box-shadow: 0 0 12px #0071e3, 0 0 24px #0071e3; }
    .cursor-ring {
      width: 36px; height: 36px; border: 1.5px solid rgba(255,255,255,0.5);
      transition: width 0.25s ease, height 0.25s ease, border-color 0.25s, background-color 0.25s;
    }
    .cursor-ring.hovering { width: 64px; height: 64px; border-color: #0071e3; background: rgba(0,113,227,0.15); }
    .cursor-glow { width: 140px; height: 140px; background: radial-gradient(circle, rgba(0,113,227,0.2) 0%, transparent 65%); filter: blur(18px); opacity: 0.7; }
    @media (hover: hover) and (pointer: fine) { body, button, input, label, a { cursor: none; } }
    @media (hover: none) { .cursor-dot, .cursor-ring, .cursor-glow { display: none; } }

    /* ФОН */
    .bg-image { position: fixed; inset: 0; z-index: -3; background: url('tree.jpg') center center / cover no-repeat; filter: brightness(0.45) contrast(1.1); }
    .bg-overlay { position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.92) 100%); pointer-events: none; }
    .bg-grid {
      position: fixed; inset: -30%; z-index: -1;
      background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px; transform: perspective(600px) rotateX(15deg); animation: gridMove 18s linear infinite; opacity: 0.4;
    }
    @keyframes gridMove { 0% { transform: perspective(600px) rotateX(15deg) translateY(0); } 100% { transform: perspective(600px) rotateX(15deg) translateY(60px); } }

    /* АНИМАЦИЯ ПОЯВЛЕНИЯ */
    .reveal { opacity: 0; transform: translateY(30px); }

    /* СТЕКЛО */
    .glass { background: rgba(15, 15, 20, 0.75); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 0 30px rgba(255,255,255,0.02); }

    /* ВИЗУАЛИЗАТОР */
    #visualizer { width: 100%; height: 70px; border-radius: 14px; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.05); }

    /* ПЛЕЙЛИСТ */
    .playlist-scroll::-webkit-scrollbar { width: 4px; }
    .playlist-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    .track-item { transition: all 0.2s ease; }
    .track-item:hover { background: rgba(255,255,255,0.08); transform: translateX(3px); }
    .track-item.active { background: rgba(0,113,227,0.2); border: 1px solid rgba(0,113,227,0.4); }
    .delete-btn { opacity: 0; transition: opacity 0.2s, color 0.2s; color: rgba(255,255,255,0.3); }
    .track-item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { color: #ff453a; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.1); border-top-color: #0071e3; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    audio { display: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-8">

  <!-- Курсор -->
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- Фон -->
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>
  <div class="bg-grid"></div>

  <!-- Заголовок -->
  <header class="reveal text-center mt-8 mb-8 z-10">
    <h1 class="text-4xl md:text-7xl font-extrabold tracking-tight">Midnight<span class="text-blue-500">Player</span></h1>
    <p class="text-white/30 text-[10px] tracking-[0.4em] uppercase mt-3 font-medium">Full Stream · Bass Visualizer · Pro</p>
  </header>

  <!-- Интерфейс -->
  <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-6 z-10">
    <!-- Плеер -->
    <div class="glass rounded-3xl p-6 flex flex-col items-center justify-between h-[560px] reveal">
      <div class="w-36 h-36 rounded-full border border-white/10 flex items-center justify-center relative overflow-hidden mb-4 shadow-[0_0_50px_rgba(0,113,227,0.2)]">
        <div id="vinyl" class="w-full h-full rounded-full bg-gradient-to-br from-[#1a1a1a] to-[#000] flex items-center justify-center border-[7px] border-[#111]">
          <div class="w-9 h-9 rounded-full bg-blue-500/20 border border-blue-500/40"></div>
        </div>
        <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/5 to-white/15 pointer-events-none"></div>
      </div>
      <canvas id="visualizer" class="mb-4"></canvas>
      <div class="text-center w-full mb-3">
        <h2 id="trackTitle" class="text-sm font-semibold truncate px-2 text-white/90">Нет трека</h2>
        <p id="trackArtist" class="text-[10px] text-white/40 mt-1">Загрузите файл или найдите онлайн</p>
      </div>
      <div class="w-full mb-3">
        <input type="range" id="progress" value="0" max="100" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none accent-blue-500">
        <div class="flex justify-between text-[9px] text-white/30 mt-1"><span id="currTime">0:00</span><span id="totalTime">0:00</span></div>
      </div>
      <div class="w-full mb-4 flex items-center gap-2">
        <svg class="w-3.5 h-3.5 text-white/30" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" class="flex-1 h-1 bg-white/10 rounded-lg appearance-none accent-blue-500">
      </div>
      <div class="flex items-center gap-7">
        <button id="prevBtn" class="text-white/40 hover:text-white transition-colors"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button id="playBtn" class="w-14 h-14 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-[0_0_25px_rgba(255,255,255,0.3)]">
          <svg id="playIcon" class="w-6 h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="nextBtn" class="text-white/40 hover:text-white transition-colors"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      </div>
    </div>

    <!-- Плейлист -->
    <div class="glass rounded-3xl p-5 col-span-1 md:col-span-2 h-[560px] flex flex-col relative overflow-hidden reveal">
      <div class="mb-3">
        <div class="flex gap-2">
          <input id="searchInput" type="text" placeholder="Поиск полных треков (Audius)..." class="flex-1 bg-white/5 border border-white/10 rounded-full px-4 py-2 text-xs outline-none focus:border-blue-500 transition-colors placeholder-white/30" />
          <button id="searchBtn" class="bg-blue-600 hover:bg-blue-500 active:scale-95 px-4 py-2 rounded-full text-xs font-medium transition-all">Найти</button>
        </div>
        <div id="searchResults" class="hidden mt-2 max-h-[100px] overflow-y-auto playlist-scroll space-y-1 bg-black/30 rounded-xl p-1"></div>
      </div>
      <div class="flex justify-between items-center mb-3 px-1">
        <h3 class="text-[10px] font-semibold uppercase tracking-wider text-white/40">Плейлист <span id="trackCount" class="text-white/20 ml-1">(0)</span></h3>
        <div class="flex gap-2">
          <button id="clearBtn" class="bg-white/5 hover:bg-red-500/20 border border-white/10 px-3 py-1.5 rounded-full text-[9px] font-medium transition-colors text-white/50 hover:text-red-400">Очистить</button>
          <label for="fileUpload" class="cursor-pointer bg-white/10 hover:bg-white/20 border border-white/10 px-3 py-1.5 rounded-full text-[9px] font-medium transition-colors flex items-center gap-1.5">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> Файл
          </label>
          <input id="fileUpload" type="file" accept="audio/*" multiple class="hidden">
        </div>
      </div>
      <div id="playlist" class="flex-1 overflow-y-auto playlist-scroll pr-1 space-y-1">
        <div class="text-center text-white/20 text-xs mt-12" id="emptyMsg">Пока пусто. Загрузи файлы или найди онлайн.</div>
      </div>
      <div id="dropZone" class="absolute inset-0 bg-blue-500/10 backdrop-blur-md border-2 border-blue-500/40 border-dashed rounded-3xl hidden items-center justify-center flex-col z-20 pointer-events-none">
        <svg class="w-10 h-10 text-blue-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
        <p class="text-blue-400 font-semibold text-sm">Отпусти, чтобы загрузить</p>
      </div>
    </div>
  </main>

  <audio id="audioPlayer" crossorigin="anonymous"></audio>
   <script>
    document.addEventListener('DOMContentLoaded', function () {
      'use strict';

      // ==================== 1. КУРСОР ====================
      var hasPointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      var dot = document.getElementById('cursorDot');
      var ring = document.getElementById('cursorRing');
      var glow = document.getElementById('cursorGlow');

      if (hasPointer && window.gsap) {
        var xDot = gsap.quickTo(dot, 'x', { duration: 0.08, ease: 'power3' });
        var yDot = gsap.quickTo(dot, 'y', { duration: 0.08, ease: 'power3' });
        var xRing = gsap.quickTo(ring, 'x', { duration: 0.35, ease: 'power3' });
        var yRing = gsap.quickTo(ring, 'y', { duration: 0.35, ease: 'power3' });
        var xGlow = gsap.quickTo(glow, 'x', { duration: 0.6, ease: 'power3' });
        var yGlow = gsap.quickTo(glow, 'y', { duration: 0.6, ease: 'power3' });

        window.addEventListener('mousemove', function (e) {
          xDot(e.clientX); yDot(e.clientY);
          xRing(e.clientX); yRing(e.clientY);
          xGlow(e.clientX); yGlow(e.clientY);
        });

        document.addEventListener('mouseleave', function () {
          gsap.to([dot, ring, glow], { opacity: 0, duration: 0.2 });
        });
        document.addEventListener('mouseenter', function () {
          gsap.to([dot, ring, glow], { opacity: 1, duration: 0.2 });
        });

        window.addEventListener('mousemove', function (e) {
          var mx = (e.clientX / window.innerWidth - 0.5) * 20;
          var my = (e.clientY / window.innerHeight - 0.5) * 20;
          gsap.to('.bg-grid', { x: mx * 0.5, y: my * 0.5, duration: 1.5, ease: 'power2.out' });
        });
      }

      function bindCursorHover() {
        if (!hasPointer || !window.gsap) return;
        document.querySelectorAll('button, label, input, a, .track-item').forEach(function (el) {
          if (el.dataset.bound) return;
          el.dataset.bound = '1';
          el.addEventListener('mouseenter', function () { ring.classList.add('hovering'); });
          el.addEventListener('mouseleave', function () { ring.classList.remove('hovering'); });
        });
      }

      // ==================== 2. АНИМАЦИЯ ПОЯВЛЕНИЯ ====================
      if (window.gsap) {
        gsap.to('.reveal', {
          opacity: 1, y: 0, duration: 1, stagger: 0.15,
          ease: 'power4.out', delay: 0.2
        });
      } else {
        document.querySelectorAll('.reveal').forEach(function (el) {
          el.style.opacity = 1; el.style.transform = 'none';
        });
      }

      // ==================== 3. ПЕРЕМЕННЫЕ ====================
      var audio = document.getElementById('audioPlayer');
      var playBtn = document.getElementById('playBtn');
      var playIcon = document.getElementById('playIcon');
      var pauseIcon = document.getElementById('pauseIcon');
      var titleEl = document.getElementById('trackTitle');
      var artistEl = document.getElementById('trackArtist');
      var progress = document.getElementById('progress');
      var volume = document.getElementById('volume');
      var currTime = document.getElementById('currTime');
      var totalTime = document.getElementById('totalTime');
      var playlistEl = document.getElementById('playlist');
      var emptyMsg = document.getElementById('emptyMsg');
      var fileUpload = document.getElementById('fileUpload');
      var dropZone = document.getElementById('dropZone');
      var vinyl = document.getElementById('vinyl');
      var trackCount = document.getElementById('trackCount');
      var clearBtn = document.getElementById('clearBtn');

      var tracks = [];
      var currentIndex = -1;
      var isPlaying = false;
      var vinylAnim = null;

      // ==================== 4. ВИЗУАЛИЗАТОР БАСА ====================
      var canvas = document.getElementById('visualizer');
      var ctx = canvas.getContext('2d');
      var audioCtx = null, analyser = null, sourceNode = null, dataArray = null;
      var vizId = null;

      function initAudioAnalyzer() {
        if (audioCtx) return;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = 0.82;
          dataArray = new Uint8Array(analyser.frequencyBinCount);
          sourceNode = audioCtx.createMediaElementSource(audio);
          sourceNode.connect(analyser);
          analyser.connect(audioCtx.destination);
        } catch (e) { audioCtx = null; }
      }

      function resizeCanvas() {
        var dpr = window.devicePixelRatio || 1;
        var rect = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, rect.width * dpr);
        canvas.height = Math.max(1, rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resizeCanvas);

      function drawVisualizer() {
        if (!analyser) return;
        vizId = requestAnimationFrame(drawVisualizer);
        analyser.getByteFrequencyData(dataArray);

        var rect = canvas.getBoundingClientRect();
        var w = rect.width, h = rect.height;
        ctx.clearRect(0, 0, w, h);

        var bassBars = 16;
        var barWidth = w / bassBars;
        var gap = 3;

        for (var i = 0; i < bassBars; i++) {
          var value = dataArray[i] / 255;
          var barHeight = Math.max(3, value * h);
          var x = i * barWidth + gap / 2;
          var barW = barWidth - gap;
          var y = h - barHeight;

          var grad = ctx.createLinearGradient(0, h, 0, y);
          grad.addColorStop(0, 'rgba(0, 113, 227, ' + (0.5 + value * 0.5) + ')');
          grad.addColorStop(1, 'rgba(66, 165, 245, ' + (0.7 + value * 0.3) + ')');

          ctx.fillStyle = grad;
          ctx.beginPath();
          var r = Math.min(barW / 2, 3);
          ctx.roundRect(x, y, barW, barHeight, [r, r, 0, 0]);
          ctx.fill();
        }
      }

      function stopVisualizer() {
        if (vizId) { cancelAnimationFrame(vizId); vizId = null; }
        var rect = canvas.getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);
      }

      // ==================== 5. РЕНДЕР ПЛЕЙЛИСТА ====================
      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function renderPlaylist() {
        Array.prototype.slice.call(playlistEl.children).forEach(function (c) {
          if (c.id !== 'emptyMsg') c.remove();
        });
        trackCount.textContent = '(' + tracks.length + ')';

        if (tracks.length === 0) {
          emptyMsg.style.display = 'block';
          return;
        }
        emptyMsg.style.display = 'none';

        tracks.forEach(function (track, index) {
          var isActive = (index === currentIndex);
          var item = document.createElement('div');
          item.className = 'track-item group flex items-center justify-between p-2.5 rounded-xl cursor-pointer'
            + (isActive ? ' active' : '');

          var icon = (isActive && isPlaying) ? '❚❚' : '▶';

          item.innerHTML =
            '<div class="flex items-center gap-3 min-w-0 flex-1">' +
              '<div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-[10px] text-white/50 shrink-0">' + icon + '</div>' +
              '<div class="min-w-0 flex-1">' +
                '<p class="text-xs font-medium text-white/90 truncate">' + escapeHtml(track.name) + '</p>' +
                '<p class="text-[9px] text-white/40 truncate">' + escapeHtml(track.artist) + '</p>' +
              '</div>' +
            '</div>' +
            '<button class="delete-btn shrink-0 ml-2 p-1.5 rounded-full hover:bg-red-500/20 transition-all" data-id="' + track.id + '">' +
              '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>' +
            '</button>';

          item.addEventListener('click', function (e) {
            if (e.target.closest('.delete-btn')) return;
            if (isActive) togglePlay();
            else { loadTrack(index); playTrack(); }
          });

          item.querySelector('.delete-btn').addEventListener('click', function (e) {
            e.stopPropagation();
            removeTrack(track.id);
          });

          playlistEl.appendChild(item);
        });

        bindCursorHover();
      }

      function removeTrack(id) {
        var idx = tracks.findIndex(function (t) { return t.id === id; });
        if (idx === -1) return;

        var wasCurrent = (idx === currentIndex);
        if (wasCurrent) {
          pauseTrack();
          audio.src = '';
          currentIndex = -1;
          titleEl.textContent = 'Нет трека';
          artistEl.textContent = 'Загрузите файл или найдите онлайн';
          progress.value = 0;
          currTime.textContent = '0:00';
          totalTime.textContent = '0:00';
        }

        if (tracks[idx].url && tracks[idx].url.indexOf('blob:') === 0) {
          URL.revokeObjectURL(tracks[idx].url);
        }

        tracks.splice(idx, 1);
        if (!wasCurrent && idx < currentIndex) currentIndex--;
        renderPlaylist();
      }

      clearBtn.addEventListener('click', function () {
        if (tracks.length === 0) return;
        if (!confirm('Очистить весь плейлист?')) return;
        pauseTrack();
        audio.src = '';
        currentIndex = -1;
        titleEl.textContent = 'Нет трека';
        artistEl.textContent = 'Загрузите файл или найдите онлайн';
        progress.value = 0;
        currTime.textContent = '0:00';
        totalTime.textContent = '0:00';
        tracks.forEach(function (t) {
          if (t.url && t.url.indexOf('blob:') === 0) URL.revokeObjectURL(t.url);
        });
        tracks = [];
        renderPlaylist();
      });

      // ==================== 6. ЗАГРУЗКА ФАЙЛОВ ====================
      function handleFiles(files) {
        var added = 0;
        Array.prototype.forEach.call(files, function (file) {
          if (file.type && file.type.indexOf('audio/') === 0) {
            tracks.push({
              id: 'local_' + Date.now() + '_' + Math.random(),
              name: file.name.replace(/\.[^/.]+$/, ''),
              artist: 'Локальный файл · полный',
              url: URL.createObjectURL(file)
            });
            added++;
          }
        });
        if (added > 0) renderPlaylist();
      }

      fileUpload.addEventListener('change', function (e) { handleFiles(e.target.files); });

      document.addEventListener('dragover', function (e) {
        e.preventDefault();
        dropZone.classList.remove('hidden');
        dropZone.classList.add('flex');
      });
      document.addEventListener('dragleave', function (e) {
        if (e.relatedTarget === null) {
          dropZone.classList.add('hidden');
          dropZone.classList.remove('flex');
        }
      });
      document.addEventListener('drop', function (e) {
        e.preventDefault();
        dropZone.classList.add('hidden');
        dropZone.classList.remove('flex');
        if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
      });

      // ==================== 7. УПРАВЛЕНИЕ ====================
      function formatTime(s) {
        if (isNaN(s)) return '0:00';
        var m = Math.floor(s / 60);
        var sec = Math.floor(s % 60);
        return m + ':' + (sec < 10 ? '0' : '') + sec;
      }

      function loadTrack(index) {
        if (index < 0 || index >= tracks.length) return;
        currentIndex = index;
        audio.src = tracks[index].url;
        titleEl.textContent = tracks[index].name;
        artistEl.textContent = tracks[index].artist;
        progress.value = 0;
        renderPlaylist();
      }

      function playTrack() {
        if (currentIndex === -1) return;
        initAudioAnalyzer();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

        audio.play().catch(function () {});
        isPlaying = true;
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        renderPlaylist();

        if (window.gsap) {
          if (vinylAnim) vinylAnim.kill();
          vinylAnim = gsap.to(vinyl, { rotation: 360, duration: 4, repeat: -1, ease: 'none' });
        }

        if (vizId) cancelAnimationFrame(vizId);
        drawVisualizer();
      }

      function pauseTrack() {
        audio.pause();
        isPlaying = false;
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        renderPlaylist();
        if (window.gsap && vinylAnim) vinylAnim.kill();
        stopVisualizer();
      }

      function togglePlay() {
        if (currentIndex === -1 && tracks.length > 0) {
          loadTrack(0);
          playTrack();
        } else if (isPlaying) pauseTrack();
        else playTrack();
      }

      playBtn.addEventListener('click', togglePlay);

      document.getElementById('nextBtn').addEventListener('click', function () {
        if (tracks.length > 0) { loadTrack((currentIndex + 1) % tracks.length); playTrack(); }
      });

      document.getElementById('prevBtn').addEventListener('click', function () {
        if (tracks.length > 0) { loadTrack((currentIndex - 1 + tracks.length) % tracks.length); playTrack(); }
      });

      audio.addEventListener('timeupdate', function () {
        if (audio.duration) {
          progress.value = (audio.currentTime / audio.duration) * 100;
          currTime.textContent = formatTime(audio.currentTime);
          totalTime.textContent = formatTime(audio.duration);
        }
      });

      progress.addEventListener('input', function () {
        if (audio.duration) audio.currentTime = (progress.value / 100) * audio.duration;
      });

      audio.addEventListener('ended', function () {
        if (tracks.length > 0) { loadTrack((currentIndex + 1) % tracks.length); playTrack(); }
      });

      volume.addEventListener('input', function () {
        audio.volume = volume.value;
      });
      audio.volume = 0.8;

      // ==================== 8. ПОИСК AUDIUS (ПОЛНЫЕ ТРЕКИ) ====================
      var searchInput = document.getElementById('searchInput');
      var searchBtn = document.getElementById('searchBtn');
      var searchResults = document.getElementById('searchResults');

      async function getAudiusHost() {
        try {
          var res = await fetch('https://api.audius.co');
          var data = await res.json();
          if (data && data.data && data.data.length) {
            return data.data[Math.floor(Math.random() * data.data.length)];
          }
        } catch (e) {}
        return 'https://discoveryprovider.audius.co';
      }

      searchBtn.addEventListener('click', async function () {
        var q = searchInput.value.trim();
        if (!q) return;

        searchResults.classList.remove('hidden');
        searchResults.innerHTML = '<div class="flex items-center gap-2 p-2 text-xs text-white/50"><span class="spinner"></span> Поиск...</div>';

        try {
          var host = await getAudiusHost();
          var res = await fetch(host + '/v1/tracks/search?query=' + encodeURIComponent(q) + '&app_name=MidnightPlayer');
          if (!res.ok) throw new Error('search');
          var data = await res.json();

          if (!data.data || data.data.length === 0) {
            searchResults.innerHTML = '<p class="text-white/40 text-xs p-2">Ничего не найдено</p>';
            return;
          }

          searchResults.innerHTML = data.data.slice(0, 6).map(function (t) {
            var title = t.title.replace(/"/g, '&quot;');
            var artist = t.user ? t.user.name.replace(/"/g, '&quot;') : 'Unknown';
            return '<div class="flex items-center justify-between p-2 rounded-lg hover:bg-white/10 cursor-pointer text-[11px] search-item" ' +
              'data-id="' + t.id + '" data-title="' + title + '" data-artist="' + artist + '">' +
                '<div class="truncate flex-1">' +
                  '<span class="text-white/90">' + t.title + '</span>' +
                  '<span class="text-white/40 ml-1">' + artist + '</span>' +
                '</div>' +
                '<span class="text-blue-400 ml-1 text-[10px]">+</span>' +
              '</div>';
          }).join('');

          searchResults.querySelectorAll('.search-item').forEach(function (el) {
            el.addEventListener('click', async function () {
              searchResults.innerHTML = '<div class="flex items-center gap-2 p-2 text-xs text-white/50"><span class="spinner"></span> Загрузка потока...</div>';
              try {
                var streamHost = await getAudiusHost();
                var streamRes = await fetch(streamHost + '/v1/tracks/' + el.dataset.id + '/stream?app_name=MidnightPlayer');
                var streamData = await streamRes.json();
                
                tracks.push({
                  id: 'online_' + el.dataset.id,
                  name: el.dataset.title,
                  artist: el.dataset.artist,
                  url: streamData.data
                });
                renderPlaylist();
                loadTrack(tracks.length - 1);
                playTrack();
                searchResults.classList.add('hidden');
                searchInput.value = '';
              } catch (err) {
                searchResults.innerHTML = '<p class="text-red-400 text-xs p-2">Ошибка загрузки</p>';
              }
            });
          });
        } catch (e) {
          searchResults.innerHTML = '<p class="text-red-400 text-xs p-2">Ошибка сети. Попробуй позже.</p>';
        }
      });

      searchInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') searchBtn.click();
      });

      // ==================== 9. ИНИЦИАЛИЗАЦИЯ ====================
      renderPlaylist();
      resizeCanvas();
      bindCursorHover();
    });
  </script>
</body>
</html>
