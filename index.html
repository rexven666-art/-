<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight Player — Pro Edition</title>

  <!-- Оптимизированные шрифты и библиотеки -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --accent: #0071e3;
      --accent-light: #42a5f5;
    }

    body, html {
      margin: 0; padding: 0;
      background: #050505; color: #fff;
      font-family: 'Inter', -apple-system, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    .bg-canvas {
  position: fixed; inset: 0; z-index: -3;
  background: #000 url('tree.jpg') center center / cover no-repeat;
  overflow: hidden;
}
.bg-canvas::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%);
  pointer-events: none;
}
    }
    
    /* Сетка с перспективой */
    .bg-grid {
      position: absolute; inset: -50%;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      transform: perspective(600px) rotateX(20deg);
      animation: gridMove 15s linear infinite;
      opacity: 0.5;
    }
    @keyframes gridMove {
      0% { transform: perspective(600px) rotateX(20deg) translateY(0); }
      100% { transform: perspective(600px) rotateX(20deg) translateY(80px); }
    }

    /* Плавающие световые пятна */
    .orb {
      position: absolute; border-radius: 50%;
      filter: blur(140px); opacity: 0.4;
      animation: float 15s ease-in-out infinite alternate;
    }
    .orb-1 { width: 600px; height: 600px; background: #0051a8; top: -10%; left: -10%; }
    .orb-2 { width: 500px; height: 500px; background: #4a2c8a; bottom: -20%; right: -10%; animation-delay: -5s; }
    .orb-3 { width: 300px; height: 300px; background: #00a8cc; top: 40%; left: 40%; opacity: 0.15; animation-delay: -2s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(80px, 60px) scale(1.1); }
    }

    /* --- Курсор --- */
    .cursor-el {
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 10000;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      will-change: transform;
    }
    #cursor-dot {
      width: 6px; height: 6px;
      background: #fff;
      box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
    }
    #cursor-ring {
      width: 36px; height: 36px;
      border: 1px solid rgba(255,255,255,0.4);
      transition: width 0.3s ease, height 0.3s ease, border-color 0.3s ease, background-color 0.3s ease;
    }
    #cursor-ring.hovering {
      width: 60px; height: 60px;
      border-color: var(--accent);
      background: rgba(0, 113, 227, 0.15);
    }
    #cursor-glow {
      width: 150px; height: 150px;
      background: radial-gradient(circle, rgba(0,113,227,0.15) 0%, transparent 60%);
      filter: blur(15px);
    }

    /* Скрываем курсор на тач-устройствах */
    @media (hover: hover) and (pointer: fine) {
      body, html, button, label, input, a { cursor: none; }
    }
    @media (hover: none) {
      .cursor-el { display: none; }
    }

    /* --- Glassmorphism --- */
    .glass {
      background: rgba(20, 20, 25, 0.6);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.02);
    }

    /* --- Визуализатор --- */
    #visualizer {
      width: 100%; height: 60px;
      border-radius: 12px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.05);
    }

    /* --- Плейлист --- */
    .playlist-scroll::-webkit-scrollbar { width: 4px; }
    .playlist-scroll::-webkit-scrollbar-track { background: transparent; }
    .playlist-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    .playlist-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

    .track-item { transition: all 0.2s ease; }
    .track-item:hover { background: rgba(255,255,255,0.08); transform: translateX(4px); }
    .track-item.active { background: rgba(0,113,227,0.15); border: 1px solid rgba(0,113,227,0.3); }
    
    .delete-btn { opacity: 0; transition: opacity 0.2s, color 0.2s; color: rgba(255,255,255,0.3); }
    .track-item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { color: #ff453a; }

    .inactive { opacity: 0.5; }
    .inactive .track-name { text-decoration: line-through; }

    /* --- Спиннер --- */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- Анимация появления --- */
    .reveal { opacity: 0; transform: translateY(20px); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

  <!-- Курсор -->
  <div id="cursor-dot" class="cursor-el"></div>
  <div id="cursor-ring" class="cursor-el"></div>
  <div id="cursor-glow" class="cursor-el"></div>

  <!-- Анимированный фон -->
  <div class="bg-canvas">
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Заголовок -->
  <header class="reveal text-center mt-6 mb-6 z-10">
    <h1 class="text-4xl md:text-6xl font-bold tracking-tight">Midnight<span class="text-blue-500">Player</span></h1>
    <p class="text-white/40 text-xs tracking-[0.3em] uppercase mt-2">Pro Edition · Visualizer · Online</p>
  </header>

  <!-- Основной интерфейс -->
  <main class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-6 z-10 reveal">

    <!-- Левая колонка: Плеер -->
    <div class="glass rounded-3xl p-6 flex flex-col items-center justify-between h-[540px]">
      
      <!-- Виниловая пластинка -->
      <div class="w-40 h-40 rounded-full border border-white/10 flex items-center justify-center relative overflow-hidden mb-4 shadow-[0_0_60px_rgba(0,113,227,0.15)]">
        <div id="vinyl" class="w-full h-full rounded-full bg-gradient-to-br from-[#1a1a1a] to-[#000] flex items-center justify-center border-[8px] border-[#111]">
          <div class="w-10 h-10 rounded-full bg-blue-500/20 border border-blue-500/40"></div>
        </div>
        <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/5 to-white/15 pointer-events-none"></div>
      </div>

      <!-- Визуализатор -->
      <canvas id="visualizer" class="mb-4"></canvas>

      <!-- Инфо о треке -->
      <div class="text-center w-full mb-4">
        <h2 id="track-title" class="text-base font-semibold truncate px-2 text-white/90">Нет трека</h2>
        <p id="track-artist" class="text-[11px] text-white/40 mt-1">Загрузите файл или найдите онлайн</p>
      </div>

      <!-- Прогресс-бар -->
      <div class="w-full mb-4">
        <input type="range" id="progress" value="0" max="100" class="w-full h-1.5 bg-white/10 rounded-lg appearance-none accent-blue-500 cursor-pointer">
        <div class="flex justify-between text-[10px] text-white/40 mt-1.5">
          <span id="curr-time">0:00</span>
          <span id="total-time">0:00</span>
        </div>
      </div>

      <!-- Управление -->
      <div class="flex items-center gap-8">
        <button id="prev-btn" class="text-white/50 hover:text-white transition-colors">
          <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button id="play-btn" class="w-16 h-16 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-[0_0_30px_rgba(255,255,255,0.2)]">
          <svg id="play-icon" class="w-7 h-7 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pause-icon" class="w-7 h-7 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="next-btn" class="text-white/50 hover:text-white transition-colors">
          <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>

    <!-- Правая колонка: Плейлист и Поиск -->
    <div class="glass rounded-3xl p-5 col-span-1 md:col-span-2 h-[540px] flex flex-col relative overflow-hidden">
      
      <!-- Поиск -->
      <div class="mb-4">
        <div class="flex gap-2">
          <input id="search-input" type="text" placeholder="Поиск в интернете (Audius)..."
                 class="flex-1 bg-white/5 border border-white/10 rounded-full px-4 py-2.5 text-xs outline-none focus:border-blue-500 transition-colors placeholder-white/30" />
          <button id="search-btn" class="bg-blue-600 hover:bg-blue-500 active:scale-95 px-5 py-2.5 rounded-full text-xs font-medium transition-all shadow-[0_0_15px_rgba(0,113,227,0.4)]">Найти</button>
        </div>
        <div id="search-results" class="hidden mt-3 max-h-[120px] overflow-y-auto playlist-scroll space-y-1 bg-black/20 rounded-xl p-1"></div>
      </div>

      <!-- Заголовок плейлиста -->
      <div class="flex justify-between items-center mb-3 px-1">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-white/50">
          Плейлист <span id="track-count" class="text-white/30 ml-1">(0)</span>
        </h3>
        <div class="flex gap-2">
          <button id="clear-btn" class="bg-white/5 hover:bg-red-500/20 border border-white/10 px-3 py-1.5 rounded-full text-[10px] font-medium transition-colors text-white/60 hover:text-red-400">
            Очистить
          </button>
          <label for="file-upload" class="cursor-pointer bg-white/10 hover:bg-white/20 border border-white/10 px-3 py-1.5 rounded-full text-[10px] font-medium transition-colors flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Добавить
          </label>
          <input id="file-upload" type="file" accept="audio/*" multiple class="hidden">
        </div>
      </div>

      <!-- Список треков -->
      <div id="playlist" class="flex-1 overflow-y-auto playlist-scroll pr-2 space-y-1">
        <div class="text-center text-white/25 text-xs mt-10" id="empty-msg">
          Пока пусто. Загрузи файлы или найди онлайн.
        </div>
      </div>

      <!-- Drag & Drop -->
      <div id="drop-zone" class="absolute inset-0 bg-blue-500/10 backdrop-blur-md border-2 border-blue-500/50 border-dashed rounded-3xl hidden items-center justify-center flex-col z-20 pointer-events-none">
        <svg class="w-12 h-12 text-blue-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
        <p class="text-blue-400 font-semibold text-sm">Отпусти, чтобы загрузить</p>
      </div>
    </div>
  </main>

  <audio id="audio-player" crossorigin="anonymous"></audio>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      'use strict';

      // 1. КУРСОР
      var hasPointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      var cursorDot = document.getElementById('cursor-dot');
      var cursorRing = document.getElementById('cursor-ring');
      var cursorGlow = document.getElementById('cursor-glow');

      if (hasPointer && window.gsap) {
        // Плавное следование
        var xDot = gsap.quickTo(cursorDot, 'x', { duration: 0.1, ease: 'power3' });
        var yDot = gsap.quickTo(cursorDot, 'y', { duration: 0.1, ease: 'power3' });
        var xRing = gsap.quickTo(cursorRing, 'x', { duration: 0.4, ease: 'power3' });
        var yRing = gsap.quickTo(cursorRing, 'y', { duration: 0.4, ease: 'power3' });
        var xGlow = gsap.quickTo(cursorGlow, 'x', { duration: 0.6, ease: 'power3' });
        var yGlow = gsap.quickTo(cursorGlow, 'y', { duration: 0.6, ease: 'power3' });

        window.addEventListener('mousemove', function (e) {
          xDot(e.clientX); yDot(e.clientY);
          xRing(e.clientX); yRing(e.clientY);
          xGlow(e.clientX); yGlow(e.clientY);
        });

        // Наведение на интерактивные элементы
        var bindCursor = function() {
          document.querySelectorAll('button, label, input, a, .track-item').forEach(function(el) {
            if (el.dataset.bound) return;
            el.dataset.bound = '1';
            el.addEventListener('mouseenter', function() { cursorRing.classList.add('hovering'); });
            el.addEventListener('mouseleave', function() { cursorRing.classList.remove('hovering'); });
          });
        };
        bindCursor();

        // Параллакс фона от мыши
        window.addEventListener('mousemove', function (e) {
          var x = (e.clientX / window.innerWidth - 0.5) * 40;
          var y = (e.clientY / window.innerHeight - 0.5) * 40;
          gsap.to('.bg-grid', { x: x * 0.2, y: y * 0.2, duration: 1.5, ease: 'power2.out' });
          gsap.to('.orb-1', { x: x * 0.5, y: y * 0.5, duration: 2, ease: 'power2.out' });
          gsap.to('.orb-2', { x: -x * 0.4, y: -y * 0.4, duration: 2, ease: 'power2.out' });
        });

        // Скрываем курсор при выходе
        document.addEventListener('mouseleave', function() {
          gsap.to([cursorDot, cursorRing, cursorGlow], { opacity: 0, duration: 0.2 });
        });
        document.addEventListener('mouseenter', function() {
          gsap.to([cursorDot, cursorRing, cursorGlow], { opacity: 1, duration: 0.2 });
        });
      }

      // 2. ПОЯВЛЕНИЕ
      if (window.gsap) {
        gsap.to('.reveal', { opacity: 1, y: 0, duration: 1, stagger: 0.2, ease: 'power4.out' });
      } else {
        document.querySelectorAll('.reveal').forEach(function(el) { el.style.opacity = 1; el.style.transform = 'none'; });
      }

      // 3. ПЕРЕМЕННЫЕ
      var audioPlayer = document.getElementById('audio-player');
      var playBtn = document.getElementById('play-btn');
      var playIcon = document.getElementById('play-icon');
      var pauseIcon = document.getElementById('pause-icon');
      var trackTitle = document.getElementById('track-title');
      var trackArtist = document.getElementById('track-artist');
      var progress = document.getElementById('progress');
      var currTime = document.getElementById('curr-time');
      var totalTime = document.getElementById('total-time');
      var playlistEl = document.getElementById('playlist');
      var emptyMsg = document.getElementById('empty-msg');
      var fileUpload = document.getElementById('file-upload');
      var dropZone = document.getElementById('drop-zone');
      var vinyl = document.getElementById('vinyl');
      var trackCount = document.getElementById('track-count');
      var clearBtn = document.getElementById('clear-btn');

      var STORAGE_KEY = 'midnight_player_v5';
      var tracks = [];
      var currentTrackIndex = -1;
      var isPlaying = false;
      var vinylAnim = null;
      var trackIdCounter = 0;

      // 4. LOCALSTORAGE
      function savePlaylist() {
        var data = tracks.map(function(t) {
          return { id: t.id, name: t.name, artist: t.artist, url: t.isOnline ? t.url : null, isOnline: t.isOnline, trackId: t.trackId || null };
        });
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
      }

      function loadPlaylist() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          var data = JSON.parse(raw);
          tracks = data.map(function(t) {
            return { id: t.id, name: t.name, artist: t.artist, url: t.isOnline ? t.url : null, isOnline: t.isOnline, trackId: t.trackId, isInactive: !t.isOnline };
          });
        } catch(e) {}
      }

      // 5. ВИЗУАЛИЗАТОР (Оптимизированный)
      var canvas = document.getElementById('visualizer');
      var ctx = canvas.getContext('2d');
      var audioCtx = null, analyser = null, sourceNode = null, dataArray = null;
      var vizId = null;

      function initAudio() {
        if (audioCtx) return;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 128;
          analyser.smoothingTimeConstant = 0.8; // Плавность
          dataArray = new Uint8Array(analyser.frequencyBinCount);
          sourceNode = audioCtx.createMediaElementSource(audioPlayer);
          sourceNode.connect(analyser);
          analyser.connect(audioCtx.destination);
        } catch(e) { audioCtx = null; }
      }

      function resizeCanvas() {
        var dpr = window.devicePixelRatio || 1;
        var rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
      }
      window.addEventListener('resize', resizeCanvas);

      function drawViz() {
        if (!analyser) return;
        vizId = requestAnimationFrame(drawViz);
        analyser.getByteFrequencyData(dataArray);

        var rect = canvas.getBoundingClientRect();
        var w = rect.width, h = rect.height;
        ctx.clearRect(0, 0, w, h);

        var bars = 32; // Меньше столбцов = быстрее отрисовка
        var barW = w / bars;
        var gap = 2;

        for (var i = 0; i < bars; i++) {
          var val = dataArray[i] / 255;
          var barH = Math.max(2, val * h);
          var x = i * barW + gap / 2;
          var y = h - barH;
          
          // Градиент от синего к фиолетовому
          var grad = ctx.createLinearGradient(0, h, 0, y);
          grad.addColorStop(0, 'rgba(0, 113, 227, ' + (0.6 + val * 0.4) + ')');
          grad.addColorStop(1, 'rgba(74, 44, 138, ' + (0.8 + val * 0.2) + ')');
          
          ctx.fillStyle = grad;
          ctx.beginPath();
          // Скругленные верхушки
          var r = Math.min((barW - gap) / 2, 4);
          ctx.roundRect(x, y, barW - gap, barH, [r, r, 0, 0]);
          ctx.fill();
        }
      }

      function stopViz() {
        if (vizId) { cancelAnimationFrame(vizId); vizId = null; }
        var rect = canvas.getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);
      }

      // 6. РЕНДЕР ПЛЕЙЛИСТА
      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function(c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function renderPlaylist() {
        Array.prototype.slice.call(playlistEl.children).forEach(function(c) {
          if (c.id !== 'empty-msg') c.remove();
        });
        trackCount.textContent = '(' + tracks.length + ')';

        if (tracks.length === 0) {
          emptyMsg.style.display = 'block';
          return;
        }
        emptyMsg.style.display = 'none';

        tracks.forEach(function(track, index) {
          var isInactive = track.isInactive || (!track.isOnline && !track.url);
          var isActive = (index === currentTrackIndex);
          var item = document.createElement('div');
          item.className = 'track-item group flex items-center justify-between p-2.5 rounded-xl cursor-pointer' 
            + (isActive ? ' active' : '') 
            + (isInactive ? ' inactive' : '');

          var icon = (isActive && isPlaying) ? '❚❚' : '▶';
          
          item.innerHTML = 
            '<div class="flex items-center gap-3 min-w-0 flex-1">' +
              '<div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-[10px] text-white/60 shrink-0">' + icon + '</div>' +
              '<div class="min-w-0 flex-1">' +
                '<p class="track-name text-xs font-medium text-white/90 truncate">' + escapeHtml(track.name) + '</p>' +
                '<p class="text-[10px] text-white/40 truncate">' + escapeHtml(track.artist) + ' ' + (track.isOnline ? '🌐' : '📁') + '</p>' +
              '</div>' +
              (isInactive ? '<button class="reactivate-btn text-[9px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full border border-blue-500/30 mr-1">Восстановить</button>' : '') +
            '</div>' +
            '<button class="delete-btn shrink-0 ml-2 p-1.5 rounded-full hover:bg-red-500/20 transition-all" data-id="' + track.id + '">' +
              '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>' +
            '</button>';

          item.addEventListener('click', function(e) {
            if (e.target.closest('.delete-btn') || e.target.closest('.reactivate-btn')) return;
            if (isInactive) return;
            if (isActive) togglePlay();
            else { loadTrack(index); playTrack(); }
          });

          item.querySelector('.delete-btn').addEventListener('click', function(e) {
            e.stopPropagation();
            removeTrack(track.id);
          });

          var rBtn = item.querySelector('.reactivate-btn');
          if (rBtn) {
            rBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              reactivateTrack(track.id);
            });
          }

          playlistEl.appendChild(item);
        });
      }

      // 7. ВОССТАНОВЛЕНИЕ ЛОКАЛЬНОГО ФАЙЛА
      function reactivateTrack(id) {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'audio/*';
        input.onchange = function(e) {
          var file = e.target.files[0];
          if (!file) return;
          var url = URL.createObjectURL(file);
          var idx = tracks.findIndex(function(t) { return t.id === id; });
          if (idx === -1) return;
          tracks[idx].url = url;
          tracks[idx].isInactive = false;
          tracks[idx].name = file.name.replace(/\.[^/.]+$/, '');
          savePlaylist();
          renderPlaylist();
        };
        input.click();
      }

      // 8. УДАЛЕНИЕ
      function removeTrack(id) {
        var idx = tracks.findIndex(function(t) { return t.id === id; });
        if (idx === -1) return;

        var wasCurrent = (idx === currentTrackIndex);
        if (wasCurrent) {
          pauseTrack();
          audioPlayer.src = '';
          currentTrackIndex = -1;
          trackTitle.textContent = 'Нет трека';
          trackArtist.textContent = 'Загрузите файл или найдите онлайн';
          progress.value = 0;
          currTime.textContent = '0:00';
          totalTime.textContent = '0:00';
        }

        if (!tracks[idx].isOnline && tracks[idx].url && tracks[idx].url.indexOf('blob:') === 0) {
          URL.revokeObjectURL(tracks[idx].url);
        }

        tracks.splice(idx, 1);
        if (!wasCurrent && idx < currentTrackIndex) currentTrackIndex--;

        savePlaylist();
        renderPlaylist();
      }

      clearBtn.addEventListener('click', function() {
        if (tracks.length === 0) return;
        if (!confirm('Очистить весь плейлист?')) return;
        pauseTrack();
        audioPlayer.src = '';
        currentTrackIndex = -1;
        trackTitle.textContent = 'Нет трека';
        trackArtist.textContent = 'Загрузите файл или найдите онлайн';
        progress.value = 0;
        currTime.textContent = '0:00';
        totalTime.textContent = '0:00';
        tracks.forEach(function(t) {
          if (!t.isOnline && t.url && t.url.indexOf('blob:') === 0) URL.revokeObjectURL(t.url);
        });
        tracks = [];
        savePlaylist();
        renderPlaylist();
      });

      // 9. ЗАГРУЗКА
      function handleFiles(files) {
        var added = 0;
        Array.prototype.forEach.call(files, function(file) {
          if (file.type && file.type.indexOf('audio/') === 0) {
            tracks.push({
              id: 'local_' + (trackIdCounter++) + '_' + Date.now(),
              name: file.name.replace(/\.[^/.]+$/, ''),
              artist: 'Локальный файл',
              url: URL.createObjectURL(file),
              isOnline: false,
              isInactive: false
            });
            added++;
          }
        });
        if (added > 0) { savePlaylist(); renderPlaylist(); }
      }

      fileUpload.addEventListener('change', function(e) { handleFiles(e.target.files); });

      document.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropZone.classList.remove('hidden');
        dropZone.classList.add('flex');
      });
      document.addEventListener('dragleave', function(e) {
        if (e.relatedTarget === null) {
          dropZone.classList.add('hidden');
          dropZone.classList.remove('flex');
        }
      });
      document.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.classList.add('hidden');
        dropZone.classList.remove('flex');
        if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
      });

      // 10. УПРАВЛЕНИЕ
      function loadTrack(index) {
        var track = tracks[index];
        if (!track || track.isInactive) return;
        currentTrackIndex = index;
        audioPlayer.src = track.url;
        trackTitle.textContent = track.name;
        trackArtist.textContent = track.artist;
        progress.value = 0;
        renderPlaylist();
      }

      function playTrack() {
        if (currentTrackIndex === -1) return;
        initAudio();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

        audioPlayer.play().catch(function() {});
        isPlaying = true;
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        renderPlaylist();

        if (window.gsap) {
          if (vinylAnim) vinylAnim.kill();
          vinylAnim = gsap.to(vinyl, { rotation: 360, duration: 4, repeat: -1, ease: 'none' });
        }

        if (vizId) cancelAnimationFrame(vizId);
        drawViz();
      }

      function pauseTrack() {
        audioPlayer.pause();
        isPlaying = false;
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        renderPlaylist();
        if (window.gsap && vinylAnim) vinylAnim.kill();
        stopViz();
      }

      function togglePlay() {
        if (currentTrackIndex === -1 && tracks.length > 0) {
          var first = tracks.findIndex(function(t) { return !t.isInactive; });
          if (first !== -1) { loadTrack(first); playTrack(); }
        } else if (isPlaying) pauseTrack();
        else playTrack();
      }

      playBtn.addEventListener('click', togglePlay);

      document.getElementById('next-btn').addEventListener('click', function() {
        if (tracks.length === 0) return;
        for (var i = 1; i <= tracks.length; i++) {
          var idx = (currentTrackIndex + i) % tracks.length;
          if (!tracks[idx].isInactive) { loadTrack(idx); playTrack(); return; }
        }
      });

      document.getElementById('prev-btn').addEventListener('click', function() {
        if (tracks.length === 0) return;
        for (var i = 1; i <= tracks.length; i++) {
          var idx = (currentTrackIndex - i + tracks.length) % tracks.length;
          if (!tracks[idx].isInactive) { loadTrack(idx); playTrack(); return; }
        }
      });

      audioPlayer.addEventListener('timeupdate', function() {
        if (audioPlayer.duration) {
          progress.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
          currTime.textContent = formatTime(audioPlayer.currentTime);
          totalTime.textContent = formatTime(audioPlayer.duration);
        }
      });

      progress.addEventListener('input', function() {
        if (audioPlayer.duration) audioPlayer.currentTime = (progress.value / 100) * audioPlayer.duration;
      });

      audioPlayer.addEventListener('ended', function() {
        if (tracks.length > 0) {
          for (var i = 1; i <= tracks.length; i++) {
            var idx = (currentTrackIndex + i) % tracks.length;
            if (!tracks[idx].isInactive) { loadTrack(idx); playTrack(); return; }
          }
        }
      });

      function formatTime(s) {
        if (isNaN(s)) return '0:00';
        var m = Math.floor(s / 60);
        var sec = Math.floor(s % 60);
        return m + ':' + (sec < 10 ? '0' : '') + sec;
      }

     // 11. ПОИСК AUDIUS (стабильная версия)
var AUDIUS_GATEWAY = 'https://api.audius.co';
var searchInput = document.getElementById('search-input');
var searchBtn = document.getElementById('search-btn');
var searchResults = document.getElementById('search-results');

async function getWorkingHost() {
  try {
    var res = await fetch(AUDIUS_GATEWAY);
    var data = await res.json();
    if (data && data.data && data.data.length) {
      return data.data[Math.floor(Math.random() * data.data.length)];
    }
  } catch (e) {}
  return 'https://discoveryprovider.audius.co';
}

async function searchAudius(query) {
  var host = await getWorkingHost();
  var url = host + '/v1/tracks/search?query=' + encodeURIComponent(query) + '&app_name=MidnightPlayer';
  var res = await fetch(url);
  if (!res.ok) throw new Error('Search failed');
  var data = await res.json();
  return data.data || [];
}

async function playOnlineTrack(trackId, title, artist) {
  try {
    var host = await getWorkingHost();
    var res = await fetch(host + '/v1/tracks/' + trackId + '/stream?app_name=MidnightPlayer');
    if (!res.ok) throw new Error('Stream failed');
    var data = await res.json();
    
    var newTrack = {
      id: 'online_' + trackId,
      name: title,
      artist: artist,
      url: data.data,
      isOnline: true,
      trackId: trackId
    };

    var exists = tracks.findIndex(function(t) { return t.id === newTrack.id; });
    if (exists !== -1) { loadTrack(exists); playTrack(); return; }

    tracks.push(newTrack);
    savePlaylist();
    renderPlaylist();
    loadTrack(tracks.length - 1);
    playTrack();

    searchResults.classList.add('hidden');
  } catch(e) {
    alert('Не удалось загрузить поток. Попробуй другой трек.');
  }
}

searchBtn.addEventListener('click', async function() {

  }
});
