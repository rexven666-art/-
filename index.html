<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight Player</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000; color: #fff; font-family: 'Inter', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 2rem; overflow-x: hidden;
    }

    /* Фон */
    .bg-image {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: url('tree.jpg') center center / cover no-repeat;
      filter: brightness(0.4); z-index: -2;
    }
    .bg-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.95) 100%);
      z-index: -1;
    }

    /* Стекло */
    .glass {
      background: rgba(20, 20, 25, 0.85); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    header { text-align: center; margin-bottom: 2rem; z-index: 10; }
    h1 { font-size: 2.5rem; font-weight: 600; }
    h1 span { color: #3b82f6; }
    header p { font-size: 0.7rem; color: rgba(255,255,255,0.4); margin-top: 0.5rem; text-transform: uppercase; letter-spacing: 0.2em; }

    main { display: grid; grid-template-columns: 1fr; gap: 1.5rem; width: 100%; max-width: 1000px; z-index: 10; }
    @media (min-width: 768px) { main { grid-template-columns: 1fr 2fr; } }

    /* Плеер */
    .player { padding: 1.5rem; display: flex; flex-direction: column; align-items: center; height: 500px; }
    .vinyl { width: 120px; height: 120px; border-radius: 50%; background: #111; border: 6px solid #222; margin-bottom: 1rem; }
    .track-info { text-align: center; width: 100%; margin-bottom: 1rem; }
    .track-info h2 { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-info p { font-size: 0.7rem; color: rgba(255,255,255,0.4); margin-top: 0.3rem; }

    /* Прогресс и громкость */
    .control-group { width: 100%; margin-bottom: 1rem; }
    input[type="range"] {
      width: 100%; height: 4px; background: rgba(255,255,255,0.1);
      border-radius: 2px; outline: none; -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      border-radius: 50%; background: #3b82f6; cursor: pointer;
    }
    .time { display: flex; justify-content: space-between; font-size: 0.6rem; color: rgba(255,255,255,0.4); margin-top: 0.4rem; }
    
    .volume-group { display: flex; align-items: center; gap: 8px; width: 100%; margin-bottom: 1rem; }
    .volume-group input { flex: 1; }

    /* Кнопки */
    .controls { display: flex; align-items: center; gap: 1.5rem; }
    button { background: none; border: none; color: #fff; cursor: pointer; transition: 0.2s; }
    .btn-play {
      width: 50px; height: 50px; border-radius: 50%; background: #fff; color: #000;
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
    }
    .btn-play:active { transform: scale(0.9); }
    .btn-skip { color: rgba(255,255,255,0.5); font-size: 1.2rem; }
    .btn-skip:hover { color: #fff; }

    /* Плейлист */
    .playlist-container { padding: 1.5rem; display: flex; flex-direction: column; height: 500px; }

    /* Поиск */
    .search-box { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .search-box input {
      flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 0.6rem 1rem; color: #fff; font-size: 0.75rem; outline: none;
    }
    .search-box button {
      background: #3b82f6; padding: 0.5rem 1rem; border-radius: 20px;
      font-size: 0.75rem; font-weight: 600;
    }

    .search-results {
      background: rgba(0,0,0,0.6); border-radius: 12px; margin-bottom: 1rem;
      max-height: 120px; overflow-y: auto; display: none;
    }
    .search-results.active { display: block; }
    .search-item { padding: 0.6rem; font-size: 0.7rem; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .search-item:hover { background: rgba(255,255,255,0.1); }

    /* Заголовок списка */
    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .list-header h3 { font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; }
    .btn-add {
      background: rgba(255,255,255,0.1); padding: 0.4rem 0.8rem; border-radius: 20px;
      font-size: 0.65rem; cursor: pointer; display: flex; align-items: center; gap: 0.3rem;
    }

    /* Список */
    .track-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.4rem; }
    .track-list::-webkit-scrollbar { width: 4px; }
    .track-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

    .track-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.5rem; border-radius: 10px; cursor: pointer; transition: 0.2s;
    }
    .track-item:hover { background: rgba(255,255,255,0.1); }
    .track-item.active { background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.4); }
    
    .track-info-small { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
    .track-icon { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 0.6rem; }
    .track-text { min-width: 0; }
    .track-text h4 { font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-text p { font-size: 0.6rem; color: rgba(255,255,255,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .btn-delete { opacity: 0; color: rgba(255,255,255,0.3); padding: 0.3rem; }
    .track-item:hover .btn-delete { opacity: 1; }
    .btn-delete:hover { color: #ff453a; }

    .empty { text-align: center; color: rgba(255,255,255,0.2); font-size: 0.75rem; margin-top: 2rem; }
    audio { display: none; }
  </style>
</head>
<body>

  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <header>
    <h1>Midnight<span>Player</span></h1>
    <p>Full Stream · Volume · Pro</p>
  </header>

  <main>
    <div class="glass player">
      <div class="vinyl" id="vinyl"></div>
      
      <div class="track-info">
        <h2 id="title">Нет трека</h2>
        <p id="artist">Загрузите файл или найдите онлайн</p>
      </div>

      <div class="control-group">
        <input type="range" id="progress" value="0" max="100" disabled>
        <div class="time"><span id="curr-time">0:00</span><span id="total-time">0:00</span></div>
      </div>

      <div class="volume-group">
        <span style="font-size:10px; color:rgba(255,255,255,0.4);">VOL</span>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
      </div>

      <div class="controls">
        <button id="prev" class="btn-skip">⏮</button>
        <button id="play" class="btn-play"><span id="play-icon">▶</span></button>
        <button id="next" class="btn-skip">⏭</button>
      </div>
    </div>

    <div class="glass playlist-container">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Поиск в интернете (Audius)...">
        <button id="search-btn">Найти</button>
      </div>
      
      <div id="search-results" class="search-results"></div>

      <div class="list-header">
        <h3>Треки</h3>
        <label for="file-upload" class="btn-add">+ Файл</label>
        <input type="file" id="file-upload" accept="audio/*" multiple style="display:none;">
      </div>

      <div id="playlist" class="track-list">
        <div class="empty" id="empty-msg">Пока пусто...</div>
      </div>
    </div>
  </main>

  <audio id="audio-player"></audio>

  <script>
    // Скрипт написан на чистом JS без async/await для максимальной совместимости
    window.onload = function() {
      var audio = document.getElementById('audio-player');
      var playBtn = document.getElementById('play');
      var playIcon = document.getElementById('play-icon');
      var titleEl = document.getElementById('title');
      var artistEl = document.getElementById('artist');
      var progress = document.getElementById('progress');
      var volume = document.getElementById('volume');
      var currTime = document.getElementById('curr-time');
      var totalTime = document.getElementById('total-time');
      var playlistEl = document.getElementById('playlist');
      var emptyMsg = document.getElementById('empty-msg');
      var fileUpload = document.getElementById('file-upload');
      
      var tracks = [];
      var currentIndex = -1;
      var isPlaying = false;

      function formatTime(s) {
        if (isNaN(s)) return '0:00';
        var m = Math.floor(s / 60);
        var sec = Math.floor(s % 60);
        return m + ':' + (sec < 10 ? '0' : '') + sec;
      }

      // --- ГРОМКОСТЬ ---
      volume.addEventListener('input', function() {
        audio.volume = volume.value;
      });
      audio.volume = 0.8;

      // --- ОТРИСОВКА СПИСКА ---
      function renderPlaylist() {
        playlistEl.innerHTML = '<div class="empty" id="empty-msg">Пока пусто...</div>';
        if (tracks.length === 0) return;
        
        playlistEl.innerHTML = ''; // Очищаем
        tracks.forEach(function(track, i) {
          var isActive = (i === currentIndex);
          var div = document.createElement('div');
          div.className = 'track-item' + (isActive ? ' active' : '');
          
          div.innerHTML = 
            '<div class="track-info-small">' +
              '<div class="track-icon">' + (isActive && isPlaying ? '❚❚' : '▶') + '</div>' +
              '<div class="track-text"><h4>' + track.name + '</h4><p>' + track.artist + '</p></div>' +
            '</div>' +
            '<button class="btn-delete" onclick="event.stopPropagation(); removeTrack(' + i + ')">🗑</button>';

          div.onclick = function() {
            if (currentIndex === i) {
              isPlaying ? pauseAudio() : playAudio();
            } else {
              loadTrack(i);
              playAudio();
            }
          };
          playlistEl.appendChild(div);
        });
      }

      // --- УДАЛЕНИЕ ---
      window.removeTrack = function(i) {
        if (currentIndex === i) {
          pauseAudio(); audio.src = ''; currentIndex = -1;
          titleEl.textContent = 'Нет трека'; artistEl.textContent = 'Загрузите файл или найдите онлайн';
          progress.value = 0;
        } else if (i < currentIndex) {
          currentIndex--;
        }
        tracks.splice(i, 1);
        renderPlaylist();
      };

      // --- УПРАВЛЕНИЕ ---
      function loadTrack(i) {
        if (i < 0 || i >= tracks.length) return;
        currentIndex = i;
        audio.src = tracks[i].url;
        titleEl.textContent = tracks[i].name;
        artistEl.textContent = tracks[i].artist;
        progress.value = 0;
        progress.disabled = false;
        renderPlaylist();
      }

      function playAudio() {
        if (currentIndex === -1) return;
        audio.play().then(function() {
          isPlaying = true;
          playIcon.textContent = '❚❚';
          renderPlaylist();
        }).catch(function(e) { console.log(e); });
      }

      function pauseAudio() {
        audio.pause();
        isPlaying = false;
        playIcon.textContent = '▶';
        renderPlaylist();
      }

      playBtn.onclick = function() {
        if (currentIndex === -1 && tracks.length > 0) {
          loadTrack(0); playAudio();
        } else if (isPlaying) {
          pauseAudio();
        } else {
          playAudio();
        }
      };

      document.getElementById('next').onclick = function() {
        if (tracks.length > 0) { loadTrack((currentIndex + 1) % tracks.length); playAudio(); }
      };

      document.getElementById('prev').onclick = function() {
        if (tracks.length > 0) { loadTrack((currentIndex - 1 + tracks.length) % tracks.length); playAudio(); }
      };

      // --- ПРОГРЕСС ---
      audio.ontimeupdate = function() {
        if (audio.duration) {
          progress.value = (audio.currentTime / audio.duration) * 100;
          currTime.textContent = formatTime(audio.currentTime);
          totalTime.textContent = formatTime(audio.duration);
        }
      };
      
      progress.oninput = function() {
        if (audio.duration) audio.currentTime = (progress.value / 100) * audio.duration;
      };

      audio.onended = function() {
        document.getElementById('next').click();
      };

      // --- ЛОКАЛЬНЫЕ ФАЙЛЫ ---
      fileUpload.onchange = function(e) {
        for (var i = 0; i < e.target.files.length; i++) {
          var file = e.target.files[i];
          if (file.type.indexOf('audio/') === 0) {
            tracks.push({
              name: file.name.replace(/\.[^/.]+$/, ''),
              artist: 'Локальный файл',
              url: URL.createObjectURL(file)
            });
          }
        }
        renderPlaylist();
      };

      // --- ПОИСК AUDIUS ---
      var searchInput = document.getElementById('search-input');
      var searchBtn = document.getElementById('search-btn');
      var searchResults = document.getElementById('search-results');

      searchBtn.onclick = function() {
        var q = searchInput.value.trim();
        if (!q) return;

        searchResults.style.display = 'block';
        searchResults.innerHTML = '<div class="search-item">Поиск...</div>';

        // Сначала получаем хост, потом ищем
        fetch('https://api.audius.co')
          .then(function(res) { return res.json(); })
          .then(function(hostData) {
            var host = 'https://discoveryprovider.audius.co';
            if (hostData && hostData.data && hostData.data.length > 0) {
              host = hostData.data[0];
            }
            
            return fetch(host + '/v1/tracks/search?query=' + encodeURIComponent(q) + '&app_name=MidnightPlayer');
          })
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (!data.data || data.data.length === 0) {
              searchResults.innerHTML = '<div class="search-item">Ничего не найдено</div>';
              return;
            }
            
            searchResults.innerHTML = '';
            data.data.slice(0, 6).forEach(function(t) {
              var div = document.createElement('div');
              div.className = 'search-item';
              div.innerHTML = '<span style="color:#fff;">' + t.title + '</span> <span style="color:#888;">' + (t.user ? t.user.name : '') + '</span>';
              
              div.onclick = function() {
                searchResults.innerHTML = '<div class="search-item">Загрузка...</div>';
                
                fetch('https://api.audius.co')
                  .then(function(res) { return res.json(); })
                  .then(function(hd) {
                    var sh = 'https://discoveryprovider.audius.co';
                    if (hd && hd.data && hd.data.length > 0) sh = hd.data[0];
                    return fetch(sh + '/v1/tracks/' + t.id + '/stream?app_name=MidnightPlayer');
                  })
                  .then(function(res) { return res.json(); })
                  .then(function(sd) {
                    tracks.push({
                      name: t.title,
                      artist: t.user ? t.user.name : 'Unknown',
                      url: sd.data
                    });
                    renderPlaylist();
                    loadTrack(tracks.length - 1);
                    playAudio();
                    searchResults.style.display = 'none';
                    searchInput.value = '';
                  })
                  .catch(function() {
                    searchResults.innerHTML = '<div class="search-item" style="color:red;">Ошибка загрузки</div>';
                  });
              };
              searchResults.appendChild(div);
            });
          })
          .catch(function() {
            searchResults.innerHTML = '<div class="search-item" style="color:red;">Ошибка сети</div>';
          });
      };

      searchInput.onkeydown = function(e) {
        if (e.key === 'Enter') searchBtn.click();
      };

      // Запуск
      renderPlaylist();
    };
  </script>
</body>
</html>
